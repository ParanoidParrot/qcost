[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcost"
version = "0.1.1"
description = "SQL query cost predictor for your PR pipeline"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "sqlglot>=23.0",
    "psycopg2-binary>=2.9",
    "PyMySQL>=1.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.14.0",
    "mypy==1.18.2",
    "types-PyYAML",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["qcost*"]
exclude = ["tests*", "action*", "testdata*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# The rule set is pinned explicitly. Without `select`, the active rules depend
# on the installed ruff version, so a new release can turn CI red with no code
# change at all.
#
# Deliberately NOT selected:
#   E1/E2/E3 — this codebase aligns keyword arguments for readability
#   BLE      — broad `except Exception` is intentional at the database-driver
#              and rule-plugin boundaries, where any exception must not abort
#              the whole run
#   PL       — pylint rules are noisy for a project this size
select = [
    "E4",   # pycodestyle: imports
    "E7",   # pycodestyle: statements
    "E9",   # pycodestyle: runtime errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is enforced by line-length, not per-line errors
    # RUF001 is kept: a confusable character in an *identifier* is worth
    # catching. RUF002/RUF003 only police prose, and the docstrings here use
    # en dashes and × deliberately.
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"